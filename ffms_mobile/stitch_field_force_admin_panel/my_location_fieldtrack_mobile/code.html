<script>
        // Simple JS for toggle interaction visuals if needed
        const toggleInput = document.getElementById('toggle');
        toggleInput.addEventListener('change', function() {
            if(this.checked) {
                this.classList.add('translate-x-6', 'border-primary-container');
                this.classList.remove('border-surface-dim', 'translate-x-0');
            } else {
                this.classList.remove('translate-x-6', 'border-primary-container');
                this.classList.add('border-surface-dim', 'translate-x-0');
            }
        });
        
        // Initialize toggle position
        if(toggleInput.checked) {
            toggleInput.classList.add('translate-x-6', 'border-primary-container');
            toggleInput.classList.remove('border-surface-dim');
        }
    </script>
