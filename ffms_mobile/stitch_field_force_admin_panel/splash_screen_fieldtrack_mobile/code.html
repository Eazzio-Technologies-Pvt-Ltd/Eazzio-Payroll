<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1E40AF 0%, #2563EB 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body>
<div class="flex flex-col items-center justify-center flex-grow fade-in-up" style="animation-delay: 0.2s;">
<!-- Logo Icon -->
<div class="bg-white/10 p-6 rounded-3xl backdrop-blur-sm shadow-2xl mb-6">
<span class="material-symbols-outlined text-6xl text-white" style="font-variation-settings: 'FILL' 1;">
                explore
            </span>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg text-headline-lg text-white mb-2 tracking-tight">FieldTrack</h1>
<!-- Tagline -->
<p class="font-body-md text-body-md text-blue-100 opacity-90 tracking-wide">Track. Work. Deliver.</p>
</div>
<!-- Loading Indicator -->
<div class="absolute bottom-16 flex flex-col items-center fade-in-up" style="animation-delay: 0.6s;">
<div class="loader mb-4"></div>
<p class="font-label-sm text-label-sm text-blue-200 uppercase tracking-widest opacity-80">Initializing</p>
</div>
<script>
        // Simple script to simulate loading and transition (for demo purposes)
        setTimeout(() => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            // In a real app, you would redirect to the main app screen here
            // window.location.href = '/login'; 
        }, 3000);
    </script>
