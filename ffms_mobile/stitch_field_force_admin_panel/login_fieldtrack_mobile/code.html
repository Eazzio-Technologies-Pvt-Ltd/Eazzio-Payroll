<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FieldTrack - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->

                        "surface-bright": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#b4c5ff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-fixed-dim": "#ffb690",
                        "on-primary-fixed": "#00174b",
                        "secondary-fixed-dim": "#62df7d",
                        "outline": "#737686",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-fixed": "#002109",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#341100",
                        "tertiary": "#8e3c00",
                        "surface": "#f7f9fb",
                        "surface-container": "#eceef0",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#b4c5ff",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "tertiary-container": "#b54e00",
                        "surface-container-highest": "#e0e3e5",
                        "on-background": "#191c1e",
                        "primary": "#004ac6",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#ffece5",
                        "on-tertiary-fixed-variant": "#783200",
                        "background": "#f7f9fb",
                        "secondary-container": "#7cf994",
                        "surface-tint": "#0053db",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "surface-variant": "#e0e3e5",
                        "secondary": "#006e2d",
                        "primary-container": "#2563eb",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed": "#7ffc97"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "touch-target-min": "44px",
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "margin": "16px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans", "sans-serif"],
                        "label-md": ["Plus Jakarta Sans", "sans-serif"],
                        "headline-md": ["Plus Jakarta Sans", "sans-serif"],
                        "label-lg": ["Plus Jakarta Sans", "sans-serif"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex flex-col justify-center px-margin max-w-md mx-auto">
<!-- Header / Brand -->
<header class="flex flex-col items-center justify-center mb-10">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-xl flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-[32px]" data-icon="explore" data-weight="fill" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">FieldTrack</h1>
</header>
<!-- Main Content -->
<main class="w-full">
<div class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please sign in to continue your shift.</p>
</div>
<form action="#" class="flex flex-col gap-stack-lg" method="POST">
<!-- Employee ID Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="employee-id">Employee ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="badge">badge</span>
<input class="w-full h-[48px] pl-12 pr-4 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="employee-id" name="employee-id" placeholder="Enter your ID" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-[48px] pl-12 pr-12 rounded-xl border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 w-[44px] h-[44px] flex items-center justify-center text-outline hover:text-on-surface-variant transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-2">
<button class="w-full h-[48px] min-h-[48px] bg-primary text-on-primary rounded-xl font-label-lg text-label-lg shadow-sm hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
                    Login
                </button>
<a class="text-center font-label-md text-label-md text-primary hover:text-primary-container transition-colors p-2" href="#">
                    Forgot Password?
                </a>
</div>
</form>
</main>
<script>
        // Simple password toggle interaction
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');
        const visibilityIcon = document.getElementById('visibility-icon');

        toggleButton.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>
</body></html>
